name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  project-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_project.py
      - run: node --check web/map.js
      - run: node --check web/genreguessr.js
      - run: node --check web/genre-cluster.js
      - run: node --check web/genrerace.js
      - run: node --check web/multiplayer.js
      - run: node --check web/i18n.js
      - run: node --check web/genre-ui.js
      - run: node --test tests/i18n.test.mjs
